# INTENTIONAL-UNTESTED: CI config; verified by the first GitHub Actions run after push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Type check (web)
        working-directory: apps/web
        run: bunx svelte-kit sync && bun run lint
      # Security gate: fail on high/critical advisories only (see SECURITY.md).
      - run: bun audit --audit-level=high
